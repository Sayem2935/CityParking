spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_SIZE:52428800}
      max-request-size: ${FILE_UPLOAD_MAX_SIZE:52428800}

  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── Application Settings ─────────────────────────────────────
app:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnly12345678901234567890}
    expiration: ${JWT_EXPIRATION:86400000}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── AI Provider Feature Flags ────────────────────────────────
# Switch between mock and real implementations.
# Default: mock (no API keys required)
# Tomorrow: change to gemini / aws once credentials are ready
ai:
  provider:
    face: ${AI_PROVIDER_FACE:mock}      # mock | aws
    vision: ${AI_PROVIDER_VISION:mock}   # mock | gemini
# ── Gemini AI API (replaces FastAPI AI Service) ──────────────
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout:
    connect-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
    read-ms: ${GEMINI_READ_TIMEOUT_MS:30000}

# ── AWS Rekognition (Face Recognition) ───────────────────────
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  region: ${AWS_REGION:us-east-1}
  rekognition:
    collection-id: ${AWS_REKOGNITION_COLLECTION_ID:cityparking-faces}
    face-match-threshold: ${AWS_FACE_MATCH_THRESHOLD:90.0}

# ── Server Configuration ─────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# ── Actuator / Monitoring ────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    defaults:
      enabled: true


# ── Logging (handled by logback-spring.xml in production) ────
logging:
  level:
    com.cityparking: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    com.cityparking.backend.service.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── Spring Profiles ──────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    com.cityparking: INFO
    org.springframework: WARN
    org.hibernate: WARN

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

# Force mock providers in test profile
ai:
  provider:
    face: mock
    vision: mock

logging:
  level:
    com.cityparking: DEBUG